[package]
name = "uefi-serial-chat"
description = """
Simple example to demonstrate that one can do some fun in UEFI and then jump
back into the normal boot flow of the system.
"""
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { version = "1.0", default-features = false, features = [] }
log = { version = "0.4", default-features = false, features = [] }
spin = { version = "0.10", default-features = false, features = ["once"] }
uart_16550 = { path = "../uart_16550" }
uefi = { version = "0.36", default-features = false, features = ["alloc", "log-debugcon", "logger"] }
uefi-raw = { version = "0.13" }

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "0.36", default-features = false, features = ["global_allocator"] }

[patch.crates-io]
uefi = { path = "../uefi-rs/uefi" }
uefi-raw = { path = "../uefi-rs/uefi-raw" }
